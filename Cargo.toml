[package]
name = "kantbench"
version = "0.2.0"
description = "KantBench: game-theory environments, opponents and evaluation for language-model agents"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/wisent-ai/OpenEnv"

[[bin]]
name = "kant"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rand_distr = "0.4"
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
ureq = "2.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tungstenite = "0.21"

[[test]]
name = "play_episode"
path = "tests/play/episode.rs"

[[test]]
name = "play_composed"
path = "tests/play/composed.rs"

[[test]]
name = "group_episodes"
path = "tests/group/episodes.rs"

[[test]]
name = "server_session"
path = "tests/server/session.rs"

[[test]]
name = "evaluation_tournament"
path = "tests/evaluation/tournament.rs"

[[test]]
name = "training_dataset"
path = "tests/training/dataset.rs"

[[test]]
name = "server_views"
path = "tests/server/views.rs"

[[test]]
name = "evaluation_matchups"
path = "tests/evaluation/matchups.rs"
